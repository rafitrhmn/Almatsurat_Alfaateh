plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Untuk upload key signing
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.apk_almatsurat" // Ganti dengan package name Anda
    compileSdk 35  // Android 15 (API 35)
    ndkVersion "27.0.12077973"  // NDK terbaru yang kompatibel

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17 // Java 17 untuk API 35
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'  // Sesuaikan dengan Java 17
    }

    buildFeatures {
        buildConfig true  // Tambahkan ini untuk mengatasi warning
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.apk_almatsurat" // Ganti dengan application ID Anda
        minSdkVersion 24 // Minimum yang disarankan Play Store
        targetSdkVersion 35  // Target Android 15
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // MultiDex support jika diperlukan
        multiDexEnabled true
    }

    // Signing config untuk release
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // Signing config
            signingConfig signingConfigs.release
            
            // Optimasi untuk Play Store
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Strip debug symbols dengan benar
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'  // ABI yang didukung Play Store
            }
        }
        
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        bundle {
        // Jangan set enableUncompressedNativeLibs, biarkan default
        }
    }

    // Packaging options untuk menghindari konflik
    packagingOptions {
        // Pick first untuk library native yang konflik
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        
        // Exclude file yang tidak diperlukan
        exclude 'META-INF/proguard/androidx-annotations.pro'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        
        // JNI libs
        jniLibs {
            useLegacyPackaging false
        }
    }

    // Lint options
    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    
    // AndroidX dependencies
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    
    // MultiDex jika diperlukan
    implementation 'androidx.multidex:multidex:2.0.1'
}
