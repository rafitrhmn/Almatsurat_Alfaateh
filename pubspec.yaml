name: apk_almatsurat
description: "Aplikasi dzikir Al-Matsurat karya Imam Hasan Al-Banna"
publish_to: "none"
version: 1.0.0+4

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter

  # BLoC
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Storage — simpan preferensi tema & notifikasi (Tahap 3 & 4)
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Hanya dipakai saat build — bukan saat runtime
  flutter_launcher_icons: ^0.14.4

# Konfigurasi icon launcher
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon_app.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/icon_app.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri/Amiri-Bold.ttf

    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/Amiri_Quran/AmiriQuran-Regular.ttf

    - family: lpmq
      fonts:
        - asset: assets/fonts/lpmq/lpmq-font.ttf

    - family: Dongle
      fonts:
        - asset: assets/fonts/Dongle/Dongle-Regular.ttf
        - asset: assets/fonts/Dongle/Dongle-Bold.ttf
        - asset: assets/fonts/Dongle/Dongle-Light.ttf
